name: Distribute to testers
on:
  push:
    tags: ["v*"]          # push a tag like v1.0.2 to release
  workflow_dispatch: {}   # or run manually from the Actions tab

jobs:
  distribute:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g firebase-tools
      - name: Distribute to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --app 1:401880298696:android:e59d2583f059183b1ee1fd \
            --groups "testers" \
            --release-notes "${{ github.ref_name }} (${{ github.sha }})"
